<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-label="Push lawn mower on grass with a wrench nearby">
  <defs>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b7d52"/>
      <stop offset="1" stop-color="#22503a"/>
    </linearGradient>
    <linearGradient id="engine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5056"/>
      <stop offset="1" stop-color="#25292d"/>
    </linearGradient>
    <linearGradient id="dome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#40464c"/>
      <stop offset="1" stop-color="#2b2f33"/>
    </linearGradient>
    <linearGradient id="turf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b7d52"/>
      <stop offset="1" stop-color="#24513a"/>
    </linearGradient>
  </defs>

  <!-- backdrop glow -->
  <circle cx="320" cy="230" r="210" fill="#f39a55" opacity=".09"/>
  <circle cx="320" cy="230" r="150" fill="#f39a55" opacity=".08"/>
  <circle cx="320" cy="230" r="210" fill="none" stroke="#f39a55" stroke-opacity=".18" stroke-width="2" stroke-dasharray="4 10"/>

  <!-- ground -->
  <ellipse cx="310" cy="424" rx="270" ry="24" fill="#071209" opacity=".45"/>
  <path d="M30 424 Q300 384 580 424 L580 444 Q300 474 30 444 Z" fill="url(#turf)"/>

  <!-- handle -->
  <path d="M182 296 L94 118" stroke="#2b2f33" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M178 286 L98 124" stroke="#4a5056" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M72 129 L114 108" stroke="#e07a2e" stroke-width="15" stroke-linecap="round"/>
  <path d="M104 146 Q140 152 134 186" stroke="#c9ccce" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <rect x="166" y="282" width="34" height="22" rx="6" fill="#1f2326"/>

  <!-- rear wheel -->
  <circle cx="180" cy="362" r="56" fill="#16191c"/>
  <circle cx="180" cy="362" r="47" fill="none" stroke="#2b2f33" stroke-width="7" stroke-dasharray="10 7"/>
  <circle cx="180" cy="362" r="23" fill="#c9ccce"/>
  <circle cx="180" cy="362" r="9" fill="#2b2f33"/>

  <!-- deck -->
  <path d="M132 304 Q132 282 154 280 L452 280 Q484 282 490 308 L496 342 Q498 356 484 356 L144 356 Q130 356 130 342 Z" fill="url(#deck)"/>
  <path d="M154 290 L450 290" stroke="#ffffff" stroke-opacity=".16" stroke-width="4" stroke-linecap="round"/>
  <rect x="150" y="320" width="330" height="9" rx="4.5" fill="#e07a2e"/>
  <rect x="150" y="334" width="330" height="3" rx="1.5" fill="#000" opacity=".15"/>

  <!-- engine -->
  <rect x="244" y="206" width="152" height="80" rx="14" fill="url(#engine)"/>
  <g stroke="#1b1e21" stroke-width="4" stroke-linecap="round">
    <path d="M262 232 H336"/><path d="M262 245 H336"/><path d="M262 258 H336"/><path d="M262 271 H336"/>
  </g>
  <path d="M230 218 Q234 160 318 156 Q402 160 406 218 Z" fill="url(#dome)"/>
  <path d="M252 202 Q264 174 312 168" stroke="#ffffff" stroke-opacity=".2" stroke-width="6" stroke-linecap="round" fill="none"/>
  <rect x="304" y="132" width="24" height="9" rx="3" fill="#c9661c"/>
  <rect x="298" y="139" width="36" height="20" rx="6" fill="#e07a2e"/>
  <rect x="394" y="214" width="38" height="52" rx="10" fill="#1f2326"/>
  <rect x="402" y="224" width="22" height="32" rx="4" fill="#2f3439"/>
  <g stroke="#1b1e21" stroke-width="2"><path d="M406 232 H420"/><path d="M406 240 H420"/><path d="M406 248 H420"/></g>
  <path d="M244 214 L226 210" stroke="#c9ccce" stroke-width="3"/>
  <rect x="204" y="204" width="26" height="11" rx="5.5" fill="#e07a2e"/>

  <!-- front wheel -->
  <circle cx="448" cy="368" r="46" fill="#16191c"/>
  <circle cx="448" cy="368" r="38" fill="none" stroke="#2b2f33" stroke-width="6" stroke-dasharray="9 6"/>
  <circle cx="448" cy="368" r="19" fill="#c9ccce"/>
  <circle cx="448" cy="368" r="7" fill="#2b2f33"/>

  <!-- wrench resting in the grass -->
  <g transform="translate(468 412) rotate(-10)">
    <rect x="0" y="-6" width="86" height="12" rx="6" fill="#c9ccce"/>
    <circle cx="94" cy="0" r="16" fill="#c9ccce"/>
    <rect x="98" y="-6" width="20" height="12" fill="#2e6a44"/>
    <circle cx="8" cy="0" r="3" fill="#7a8188"/>
  </g>

  <!-- spark plug -->
  <g transform="translate(58 404) rotate(-70)">
    <rect x="0" y="-5" width="16" height="10" rx="2" fill="#e8e6df"/>
    <rect x="16" y="-8" width="12" height="16" rx="2" fill="#7a8188"/>
    <rect x="28" y="-4" width="12" height="8" fill="#c9ccce"/>
  </g>

  <!-- grass blades -->
  <g fill="#4c9465">
    <path d="M40 430 q4 -20 11 -28 q-3 15 1 28z"/>
    <path d="M64 432 q2 -16 -4 -26 q9 9 10 26z"/>
    <path d="M118 428 q5 -18 12 -24 q-4 13 -1 24z"/>
    <path d="M230 422 q3 -14 9 -20 q-2 11 0 20z"/>
    <path d="M300 420 q-2 -15 -8 -22 q10 8 12 22z"/>
    <path d="M360 421 q4 -14 10 -19 q-3 10 -1 19z"/>
    <path d="M540 430 q-3 -20 -10 -28 q12 10 14 28z"/>
    <path d="M520 432 q3 -14 8 -19 q-2 10 0 19z"/>
  </g>
  <g fill="#5aa673" opacity=".8">
    <path d="M88 436 q3 -14 9 -19 q-2 10 -1 19z"/>
    <path d="M410 426 q3 -13 8 -18 q-2 10 -1 18z"/>
    <path d="M560 434 q2 -12 7 -16 q-2 9 -1 16z"/>
  </g>
</svg>
